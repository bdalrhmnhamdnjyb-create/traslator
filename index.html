<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُشتقات - قاموس عائلات الكلمات الإنجليزية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Readex Pro', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 30px 15px; }
        .app-container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #a855f7); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .search-box { display: flex; gap: 10px; }
        .input-field { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; color: var(--text); font-size: 15px; outline: none; }
        .input-field:focus { border-color: var(--primary); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; border-radius: 14px; padding: 0 24px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 10px; }
        .word-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .type-tag { background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .word-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; direction: ltr; text-align: right; }
        .phonetic { font-size: 13px; color: var(--text-muted); }
        .meaning { font-size: 14px; color: #cbd5e1; border-top: 1px dashed var(--border); padding-top: 8px; }
        .loader { display: none; text-align: center; padding: 30px; color: var(--text-muted); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 12px; border-radius: 12px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand">
            <div class="brand-icon">📚</div>
            <h1>مُشتقات</h1>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="wordInput" class="input-field" placeholder="اكتب الكلمة الإنجليزية (مثال: Act, Inform)..." onkeyup="if(event.key==='Enter') fetchWordFamily()">
        <button class="btn-primary" onclick="fetchWordFamily()">استخراج</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div>جاري تحليل الكلمة واستخراج جميع مشتقاتها...</div>
    </div>
    
    <div id="resultsGrid" class="results-grid"></div>
</div>

<script>
    // الـ 5 مفاتيح الخاصة بك مع إمكانية التدوير التلقائي عند انتهاء أي مفتاح
    const API_KEYS = [
        "AIzaSyCTh80fhgR4vqg5dJZa6MkfoV1GkkzgYYw",
        "AIzaSyB-WGhn1HWI61PonRyRVsq190spZII8Sns",
        
    ];

    function speakWord(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    async function fetchWithKeyRotation(promptText) {
        let lastError = null;

        for (let i = 0; i < API_KEYS.length; i++) {
            const currentKey = API_KEYS[i];
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                const data = await response.json();

                if (data.error) {
                    console.warn(`المفتاح رقم ${i + 1} أرجع خطأ، جاري التبديل للمفتاح التالي...`);
                    lastError = data.error.message;
                    continue; 
                }

                return data;

            } catch (err) {
                console.warn(`فشل الاتصال مع المفتاح رقم ${i + 1}`);
                lastError = err.message;
            }
        }

        throw new Error("جميع المفاتيح الخمسة أرجعت خطأ: " + lastError);
    }

    async function fetchWordFamily() {
        const word = document.getElementById('wordInput').value.trim().toLowerCase();
        const loader = document.getElementById('loader');
        const grid = document.getElementById('resultsGrid');

        showError('');

        if (!word) {
            showError('يرجى إدخال كلمة للبحث عنها.');
            return;
        }

        const cachedData = localStorage.getItem(`cache_${word}`);
        if (cachedData) {
            renderCards(JSON.parse(cachedData));
            return;
        }

        loader.style.display = 'block';
        grid.innerHTML = '';

        const promptText = `Word family for "${word}". Return ONLY a JSON array of objects with keys: "type" (Arabic part of speech like اسم, فعل), "word" (English), "pronunciation" (Arabic letters), "meaning" (Arabic translation).`;

        try {
            const data = await fetchWithKeyRotation(promptText);

            let rawText = data.candidates[0].content.parts[0].text.trim();
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            
            const derivatives = JSON.parse(rawText);
            
            localStorage.setItem(`cache_${word}`, JSON.stringify(derivatives));
            renderCards(derivatives);

        } catch (err) {
            showError('حدث خطأ: ' + err.message);
        } finally {
            loader.style.display = 'none';
        }
    }

    function renderCards(derivatives) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        derivatives.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="type-tag">${item.type}</span>
                    <button class="audio-btn" onclick="speakWord('${item.word.replace(/'/g, "\\'")}')" style="background:none; border:none; cursor:pointer; color:var(--text-muted);">
                        🔊
                    </button>
                </div>
                <div class="word-title">${item.word}</div>
                <div class="phonetic">النطق: ${item.pronunciation}</div>
                <div class="meaning">${item.meaning}</div>
            `;
            grid.appendChild(card);
        });
    }

    function showError(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = msg;
        errorDiv.style.display = msg ? 'block' : 'none';
    }
</script>

</body>
</html>
