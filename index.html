<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُشتقات - قاموس الكلمات</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Readex Pro', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        .card-box { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .row { display: flex; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .word-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .tag { background: #312e81; color: #a5b4fc; font-size: 12px; padding: 3px 8px; border-radius: 6px; width: fit-content; }
        .word { font-size: 18px; font-weight: 700; direction: ltr; text-align: right; }
        .error { background: #451a1a; color: #f87171; padding: 10px; border-radius: 8px; display: none; }
        .loading { display: none; text-align: center; color: var(--text-muted); margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 قاموس مشتقات الكلمات</h2>
    
    <!-- حفظ المفتاح محلياً -->
    <div class="card-box">
        <label style="font-size: 12px; color: var(--text-muted);">مفتاح API Key (يبدأ بـ AIzaSy):</label>
        <div class="row" style="margin-top: 5px;">
            <input type="password" id="apiKey" placeholder="أدخل المفتاح هنا..." />
            <button onclick="saveKey()">حفظ المفتاح</button>
        </div>
    </div>

    <!-- البحث -->
    <div class="row">
        <input type="text" id="wordInput" placeholder="اكتب كلمة إنجليزية (مثال: create, act)..." onkeyup="if(event.key==='Enter') search()">
        <button onclick="search()">بحث</button>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="loadingBox" class="loading">⏳ جاري جلب المشتقات...</div>
    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    // تحميل المفتاح من الذاكرة المحلية عند الفتح
    window.onload = () => {
        const saved = localStorage.getItem('GEMINI_KEY');
        if (saved) document.getElementById('apiKey').value = saved;
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('GEMINI_KEY', key);
            alert('تم حفظ المفتاح بنجاح في متصفحك!');
        }
    }

    async function search() {
        const key = localStorage.getItem('GEMINI_KEY') || document.getElementById('apiKey').value.trim();
        const word = document.getElementById('wordInput').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loadingBox = document.getElementById('loadingBox');
        const grid = document.getElementById('resultsGrid');

        errorBox.style.display = 'none';
        grid.innerHTML = '';

        if (!key) return showError('يرجى أدخال مفتاح API وحفظه أولاً.');
        if (!word) return showError('يرجى كتابة كلمة للبحث.');

        loadingBox.style.display = 'block';

        // رابط API المضمون مع اسم الموديل المستقر
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;

        const prompt = `Give me the full word family for the English word "${word}". Return a JSON array of objects, where each object has:
        - "type": (noun, verb, adjective, adverb translated to Arabic like اسم, فعل, صفة, ظرف)
        - "word": (the English derivative word)
        - "pronunciation": (phonetic writing in Arabic letters)
        - "meaning": (Arabic translation)`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        response_mime_type: "application/json" // يضمن إرجاع JSON نقي 100%
                    }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'حدث خطأ أثناء الاتصال بالخادم');
            }

            const rawText = data.candidates[0].content.parts[0].text;
            const derivatives = JSON.parse(rawText);

            renderResults(derivatives);

        } catch (err) {
            showError(err.message);
        } finally {
            loadingBox.style.display = 'none';
        }
    }

    function renderResults(list) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        list.forEach(item => {
            grid.innerHTML += `
                <div class="word-card">
                    <span class="tag">${item.type}</span>
                    <div class="word">${item.word}</div>
                    <div style="font-size: 13px; color: var(--text-muted);">النطق: ${item.pronunciation}</div>
                    <div style="font-size: 14px; margin-top: 5px;">${item.meaning}</div>
                </div>
            `;
        });
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }
</script>
</body>
</html>
